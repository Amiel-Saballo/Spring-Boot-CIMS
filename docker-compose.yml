services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cims
      MYSQL_USER: cims
      MYSQL_PASSWORD: cims
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - cims_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/cims?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila
      DB_USERNAME: cims
      DB_PASSWORD: cims
      DEMO_PASSWORD: ChangeMe123!
    ports:
      - "8080:8080"

volumes:
  cims_mysql:
