spring:
  application:
    name: clinic-inventory-management-system
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cims?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila}
    username: ${DB_USERNAME:cims}
    password: ${DB_PASSWORD:cims}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Manila
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

app:
  seed-demo-data: ${SEED_DEMO_DATA:true}
  demo-password: ${DEMO_PASSWORD:ChangeMe123!}
  pagination:
    default-size: 10
    max-size: 100
